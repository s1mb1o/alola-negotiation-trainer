[project]
name = "negotiation-trainer"
version = "0.1.0"
description = "API-first negotiation training engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "jsonschema>=4.25,<5",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "clients/tests", "benchmarks/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
